# Full stack: nginx (web) -> FastAPI (api) -> Redis (shared result cache).
#
#   docker compose up --build              # http://localhost:8080
#   docker compose up --scale api=3        # more API replicas; nginx balances across them
#
# The API serves whatever is in ./models/current (model.onnx + model.json).

name: skin-lesion-classifier

services:
  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./api
    environment:
      MODEL_DIR: /models/current
      REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: ${API_WORKERS:-2}
      MAX_CONCURRENT_INFERENCES: ${MAX_CONCURRENT_INFERENCES:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./models:/models:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
