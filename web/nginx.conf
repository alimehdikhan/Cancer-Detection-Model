# Rendered by the official nginx image's envsubst step into /etc/nginx/conf.d/default.conf
# (see Dockerfile). Only ${API_UPSTREAM} and ${NGINX_RESOLVER} are substituted; every other
# $variable is left for nginx. This file is included inside the http {} block.

limit_req_zone $binary_remote_addr zone=predict:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Resolve the API at request time so nginx starts even if the API container is not up yet.
    resolver ${NGINX_RESOLVER} valid=30s ipv6=off;
    set $api_upstream ${API_UPSTREAM};

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Uploads: rate limited per client IP. Excess requests get 429.
    location = /api/v1/predict {
        limit_req zone=predict burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location /api/ {
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Content-hashed build output: cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /favicon.svg {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # The app shell must always be revalidated so new deploys are picked up immediately.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
