# Included in every location that sets its own headers (add_header does not inherit).
# The script-src hash allows the pre-paint theme script in index.html; `pnpm build` fails
# (scripts/check-csp.mjs) if the script changes without this hash being updated.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-hHYtN9+ZuiQ9IJ00ckCGtj6PGLzFouojgpWm7HHh9dY='; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
